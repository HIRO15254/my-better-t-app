name: Workflow Commands

on:
  issue_comment:
    types: [created]

permissions:
  issues: write

jobs:
  handle-command:
    runs-on: ubuntu-latest
    if: >-
      !github.event.comment.user.bot &&
      startsWith(github.event.comment.body, '/')
    steps:
      - name: Process workflow command
        uses: actions/github-script@v7
        with:
          script: |
            const body = github.event.comment.body.trim();
            const issue = context.payload.issue;
            const labels = issue.labels.map(l => l.name);
            const repo = context.repo;
            const issueNumber = issue.number;

            // Helper: ラベル遷移
            async function transition(from, to) {
              try {
                await github.rest.issues.removeLabel({ ...repo, issue_number: issueNumber, name: from });
              } catch (e) {
                // ラベルが存在しない場合は無視
              }
              await github.rest.issues.addLabels({ ...repo, issue_number: issueNumber, labels: [to] });
              // リアクションで操作完了を通知
              await github.rest.reactions.createForIssueComment({
                ...repo,
                comment_id: context.payload.comment.id,
                content: 'rocket'
              });
            }

            // /approve コマンド
            if (body.startsWith('/approve')) {
              const transitions = {
                'wf:spec-review': 'wf:needs-plan',
                'wf:plan-review': 'wf:implementing',
                'wf:impl-review': 'wf:done',
              };
              for (const [from, to] of Object.entries(transitions)) {
                if (labels.includes(from)) {
                  await transition(from, to);
                  // impl-review の承認時はIssueをクローズ
                  if (from === 'wf:impl-review') {
                    await github.rest.issues.update({ ...repo, issue_number: issueNumber, state: 'closed' });
                  }
                  return;
                }
              }
            }

            // /reject コマンド（1つ前の状態へ差し戻し）
            if (body.startsWith('/reject') && !body.startsWith('/reject-to-spec')) {
              const transitions = {
                'wf:spec-review': 'wf:needs-spec',
                'wf:plan-review': 'wf:needs-plan',
              };
              for (const [from, to] of Object.entries(transitions)) {
                if (labels.includes(from)) {
                  await transition(from, to);
                  return;
                }
              }
            }

            // /reject-to-spec コマンド（仕様からやり直し）
            if (body.startsWith('/reject-to-spec')) {
              const rejectableStates = ['wf:plan-review', 'wf:impl-review'];
              for (const from of rejectableStates) {
                if (labels.includes(from)) {
                  await transition(from, 'wf:needs-spec');
                  return;
                }
              }
            }

            // /change-spec コマンド（実装レビュー中の仕様変更要求）
            if (body.startsWith('/change-spec')) {
              if (labels.includes('wf:impl-review')) {
                await transition('wf:impl-review', 'wf:needs-spec');
                return;
              }
            }
